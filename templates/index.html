<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remoteable — Live Show Control</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <h1>Remoteable</h1>
        <span id="connection-badge" class="badge badge-disconnected">disconnected</span>
      </div>
      <div class="header-right">
        <nav id="view-nav" class="view-nav">
          <button id="nav-performance" class="btn btn-nav-tab active" type="button" data-view="performance">Performance</button>
          <button id="nav-setlist" class="btn btn-nav-tab" type="button" data-view="setlist">Setlist</button>
          <button id="nav-settings" class="btn btn-nav-tab" type="button" data-view="settings">Settings</button>
        </nav>
        <button id="btn-rescan" class="btn btn-secondary" title="Re-scan arrangement">Rescan</button>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="error-banner" class="error-banner hidden"></div>

    <!-- Main Content -->
    <main>
      <div id="view-performance">
      <!-- Live Display Panel -->
      <section id="live-panel" class="panel">
        <div id="now-playing">
          <div id="song-name" class="song-name">--</div>
          <div id="section-display" class="section-display">
            <div id="section-name" class="section-name">--</div>
            <div class="progress-bar section-progress" aria-hidden="true">
              <div class="progress-bar-fill"></div>
            </div>
          </div>
        </div>
        <div id="chords-display" class="chords-display">
          <div id="chords-text" class="chords-text">--</div>
        </div>
        <div id="lyrics-display" class="lyrics-display">
          <div id="lyrics-text">--</div>
        </div>
        <div id="transport-info">
          <span id="transport-position">0.0</span>
          <span id="transport-tempo">120 BPM</span>
          <span id="transport-time-sig">4/4</span>
        </div>
      </section>

      <!-- Transport Controls -->
      <section id="transport-controls" class="panel transport-panel">
        <button id="btn-play" class="btn btn-play">Play</button>
        <button id="btn-stop" class="btn btn-stop">Stop</button>
        <button id="btn-prev" class="btn btn-nav" title="Previous song">Prev</button>
        <button id="btn-next" class="btn btn-nav" title="Next song">Next</button>
        <div id="auto-advance-info" class="auto-advance-info hidden"></div>
      </section>

      <!-- Setlist / Song List -->
      <section id="setlist-panel" class="panel">
        <h2>Songs</h2>
        <ul id="song-list" class="song-list"></ul>
      </section>

      </div>

      <div id="view-setlist" hidden>
        <section id="setlist-editor-panel" class="panel setlist-editor-panel">
          <div class="setlist-toolbar">
            <div class="setlist-toolbar-left">
              <input id="setlist-name" class="setlist-name-input" type="text" placeholder="Setlist name">
              <select id="setlist-load" class="setlist-load-select">
                <option value="">Load setlist…</option>
              </select>
              <span id="setlist-active-badge" class="setlist-active-badge hidden">Active</span>
            </div>
            <div class="setlist-toolbar-actions">
              <button id="btn-setlist-new" class="btn btn-secondary" type="button">New</button>
              <button id="btn-setlist-save" class="btn btn-play" type="button">Save</button>
              <button id="btn-setlist-delete" class="btn btn-stop" type="button">Delete</button>
              <button id="btn-setlist-activate" class="btn btn-secondary" type="button">Activate</button>
            </div>
          </div>
          <p id="setlist-editor-status" class="setlist-editor-status"></p>
          <div class="setlist-editor-columns">
            <div class="setlist-column">
              <h2>Available Songs</h2>
              <ul id="available-songs" class="available-songs-list"></ul>
            </div>
            <div class="setlist-column">
              <h2>Setlist</h2>
              <ul id="editor-setlist" class="editor-setlist"></ul>
            </div>
          </div>
        </section>
      </div>

      <div id="view-settings" hidden>
        <section id="settings-panel" class="panel settings-panel">
          <h2>Engine Settings</h2>
          <p class="settings-intro">Configuration is stored in the database and applied immediately.</p>
          <form id="settings-form" class="settings-form">
            <div class="form-group">
              <label for="setting-osc-host">Ableton OSC Host</label>
              <input id="setting-osc-host" name="ableton_osc_host" type="text" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="setting-osc-send-port">Send Port</label>
                <input id="setting-osc-send-port" name="ableton_osc_send_port" type="number" min="1" max="65535" required>
              </div>
              <div class="form-group">
                <label for="setting-osc-recv-port">Receive Port</label>
                <input id="setting-osc-recv-port" name="ableton_osc_recv_port" type="number" min="1" max="65535" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="setting-poll-hz">Poll Rate (Hz)</label>
                <input id="setting-poll-hz" name="engine_poll_hz" type="number" min="1" max="60" required>
              </div>
              <div class="form-group">
                <label for="setting-preroll">Pre-roll (bars)</label>
                <input id="setting-preroll" name="default_preroll_bars" type="number" min="0" max="16" required>
              </div>
            </div>
            <div class="settings-actions">
              <button id="btn-settings-save" class="btn btn-play" type="submit">Save</button>
              <span id="settings-status" class="settings-status"></span>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=9"></script>
</body>
</html>
