name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Django system check
        run: REMOTEABLE_NO_ENGINE=1 .venv/bin/python manage.py check

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt pyinstaller pillow

      - name: Build RemoteAble.app
        run: .venv/bin/python scripts/build_mac_app.py

      - name: Ad-hoc sign the app bundle
        run: codesign --force --deep --sign - dist/RemoteAble.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/RemoteAble.app dist/RemoteAble-macOS.zip

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}-${{ github.sha }}
          name: RemoteAble ${{ github.run_number }}
          body: Automated build from ${{ github.sha }}
          files: dist/RemoteAble-macOS.zip
