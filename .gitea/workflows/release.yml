name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Django system check
        run: STAGEABLE_NO_ENGINE=1 .venv/bin/python manage.py check

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          STAGEABLE_VERSION="$(python3 scripts/versioning/next_version.py)"
          echo "value=$STAGEABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "STAGEABLE_VERSION=$STAGEABLE_VERSION" >> "$GITHUB_ENV"
          python3 scripts/versioning/next_version.py --write

      - name: Create and push version tag
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.local"
          git tag -a "v${STAGEABLE_VERSION}" -m "Release v${STAGEABLE_VERSION}"
          git push origin "v${STAGEABLE_VERSION}"

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Purge pip cache
        run: .venv/bin/pip cache purge || true

      - name: Install dependencies
        run: .venv/bin/pip install --no-cache-dir -r requirements.txt pyinstaller pillow

      - name: Build StageAble.app
        run: DJANGO_SETTINGS_MODULE=stageable.settings STAGEABLE_VERSION=${{ steps.version.outputs.value }} .venv/bin/python scripts/build_mac_app.py

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/StageAble.app dist/StageAble-macOS.zip

      - name: Generate Sparkle appcast
        run: |
          STAGEABLE_VERSION="${{ steps.version.outputs.value }}"
          SIZE=$(stat -f%z dist/StageAble-macOS.zip)
          python3 scripts/packaging/generate_appcast.py \
            --version "$STAGEABLE_VERSION" \
            --macos-url "https://downloads.stageable.app/StageAble-macOS-${STAGEABLE_VERSION}.zip" \
            --length "$SIZE" \
            -o dist/appcast-macos.xml

      - name: Sign and notarize (optional)
        if: env.CODESIGN_IDENTITY != ''
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/packaging/sign_and_notarize.sh
          ./scripts/packaging/sign_and_notarize.sh dist/StageAble.app
          ditto -c -k --keepParent dist/StageAble.app dist/StageAble-macOS.zip

      - name: Upload to CDN (optional)
        if: env.STAGEABLE_CDN_UPLOAD_CMD != ''
        env:
          STAGEABLE_CDN_UPLOAD_CMD: ${{ secrets.STAGEABLE_CDN_UPLOAD_CMD }}
        run: |
          eval "$STAGEABLE_CDN_UPLOAD_CMD"

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.value }}
          name: StageAble v${{ steps.version.outputs.value }}
          body: Automated release v${{ steps.version.outputs.value }} from ${{ github.sha }}
          files: |
            dist/StageAble-macOS.zip
            dist/appcast-macos.xml
