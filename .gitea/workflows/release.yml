name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Django system check
        run: REMOTEABLE_NO_ENGINE=1 .venv/bin/python manage.py check

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          REMOTEABLE_VERSION="$(python3 scripts/versioning/next_version.py)"
          echo "value=$REMOTEABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "REMOTEABLE_VERSION=$REMOTEABLE_VERSION" >> "$GITHUB_ENV"
          python3 scripts/versioning/next_version.py --write

      - name: Create and push version tag
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.local"
          git tag -a "v${REMOTEABLE_VERSION}" -m "Release v${REMOTEABLE_VERSION}"
          git push origin "v${REMOTEABLE_VERSION}"

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Purge pip cache
        run: .venv/bin/pip cache purge || true

      - name: Install dependencies
        run: .venv/bin/pip install --no-cache-dir -r requirements.txt pyinstaller pillow

      - name: Build RemoteAble.app
        run: DJANGO_SETTINGS_MODULE=remoteable.settings REMOTEABLE_VERSION=${{ steps.version.outputs.value }} .venv/bin/python scripts/build_mac_app.py

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/RemoteAble.app dist/RemoteAble-macOS.zip

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.value }}
          name: RemoteAble v${{ steps.version.outputs.value }}
          body: Automated release v${{ steps.version.outputs.value }} from ${{ github.sha }}
          files: dist/RemoteAble-macOS.zip
