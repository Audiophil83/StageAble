name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: REMOTEABLE_NO_ENGINE=1 python manage.py check

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build RemoteAble.app
        run: python scripts/build_mac_app.py

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/RemoteAble.app dist/RemoteAble-macOS.zip

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}-${{ github.sha }}
          name: RemoteAble ${{ github.run_number }}
          body: Automated build from ${{ github.sha }}
          files: dist/RemoteAble-macOS.zip
