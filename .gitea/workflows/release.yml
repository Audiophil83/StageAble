name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Django system check
        run: REMOTEABLE_NO_ENGINE=1 .venv/bin/python manage.py check

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Create virtual environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Purge pip cache
        run: .venv/bin/pip cache purge || true

      - name: Install dependencies
        run: .venv/bin/pip install --no-cache-dir -r requirements.txt pyinstaller pillow

      - name: Build RemoteAble.app
        run: DJANGO_SETTINGS_MODULE=remoteable.settings .venv/bin/python scripts/build_mac_app.py

      - name: Smoke test app bundle
        run: |
          dist/RemoteAble.app/Contents/MacOS/RemoteAble --no-ui &
          APP_PID=$!
          sleep 5
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "Smoke test passed — app is running (PID $APP_PID)"
            kill "$APP_PID"
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "Smoke test FAILED — app exited early"
            echo "--- daphne.log ---"
            cat "$HOME/Library/Application Support/RemoteAble/daphne.log" 2>/dev/null || echo "(no log file)"
            exit 1
          fi

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/RemoteAble.app dist/RemoteAble-macOS.zip

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}-${{ github.sha }}
          name: RemoteAble ${{ github.run_number }}
          body: Automated build from ${{ github.sha }}
          files: dist/RemoteAble-macOS.zip
